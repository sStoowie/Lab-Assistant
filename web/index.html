<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Debug Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="custom-cursor" id="cursor"></div>
    <div id="errorBanner" class="app-error hidden" role="alert" aria-live="assertive"></div>
    <div class="app">
        <!-- HOMEPAGE -->
        <div id="homepage">
            <div class="home-header">
                <h1>Lab Debug Assistant</h1>
                <p class="home-subtitle">AWS Training — TA Internal Tool</p>
            </div>
            <div class="home-grid" id="labGrid"></div>
        </div>

        <!-- LAB PAGE -->
        <div id="labpage" class="hidden">
            <header>
                <div class="header-top">
                    <button class="back-btn" onclick="goHome()">← Labs</button>
                    <h1 id="labTitle"></h1>
                    <span class="badge">TA Tool</span>
                </div>
                <p id="labDesc" class="lab-desc"></p>
            </header>

            <div class="toolbar">
                <div class="jump-group">
                    <label for="jumpInput">Jump</label>
                    <input type="number" id="jumpInput" min="1" step="1" placeholder="#" aria-label="ไปที่เลขข้อ">
                    <button type="button" id="jumpBtn">Go</button>
                </div>
                <div class="search-group">
                    <label for="searchInput">Search</label>
                    <input type="search" id="searchInput" placeholder="ค้นหา error ที่ผู้เรียนเจอ, ชื่อ resource, keyword…" aria-label="ค้นหา step และ error">
                    <button type="button" id="clearSearchBtn">Clear</button>
                </div>
            </div>
            <p id="searchStatus" class="search-status hidden" role="status" aria-live="polite"></p>

            <div class="spec-section">
                <div class="spec-tabs" role="tablist">
                    <button class="spec-tab active" data-tab="spec" role="tab" aria-selected="true">Spec</button>
                    <button class="spec-tab" data-tab="steps" role="tab" aria-selected="false">Steps & Errors</button>
                    <button class="spec-tab" data-tab="troubleshoot" role="tab" aria-selected="false">Troubleshoot</button>
                </div>
                <div id="tab-spec" class="tab-content"></div>
                <div id="tab-steps" class="tab-content hidden"></div>
                <div id="tab-troubleshoot" class="tab-content hidden"></div>
            </div>
        </div>
    </div>

    <script src="lab1-data.js"></script>
    <script src="lab2-data.js"></script>
    <script src="lab3-data.js"></script>
    <script src="lab4-data.js"></script>
    <script src="lab5-data.js"></script>
    <script src="lab6-data.js"></script>
    <script src="lab7-data.js"></script>
    <script src="specs.js"></script>
    <script src="troubleshoot.js"></script>
    <script src="app.js"></script>
</body>
</html>
